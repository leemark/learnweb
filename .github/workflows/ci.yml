name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Integrity checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke tests (Chromium)
        run: npm test

      - name: Smoke tests (Firefox)
        run: npx playwright test --version >/dev/null 2>&1; BROWSER=firefox node smoke-test.mjs

      - name: Smoke tests (WebKit)
        run: BROWSER=webkit node smoke-test.mjs
