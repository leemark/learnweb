<!doctype html>
<html lang="en" data-theme="ink">

    <link rel="stylesheet" href="/static.css">
    <style>
      .missing { width: var(--page); margin-inline: auto; padding: 5rem 0; }
      .missing .lesson-kicker { margin-top: 0; }
      .missing h1 { margin-top: .9rem; font-size: clamp(2rem, 5vw, 3.2rem); }
      .missing p { margin-top: 1rem; color: #b7b8bf; max-width: 55ch; }
      .missing-actions { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2rem; }
      .missing-actions a { display: inline-block; padding: .8rem 1.2rem; border-radius: .6rem; background: var(--accent); color: #0b0b0e; font-weight: 700; font-size: .9rem; text-decoration: none; }
      .missing-actions a.secondary { background: transparent; border: 1px solid var(--line); color: #f4f1e8; }

  </head>
  <body>
    <header class="static-header">
      <a class="wordmark" href="/">learn<span>.</span>web</a>
      <span>404</span>

      <p class="lesson-kicker">404 — not found</p>
      <h1>That page drifted off the map.</h1>
      <p>The address you followed doesn’t exist here. The curriculum, however, is exactly where it should be.</p>

        <a href="/">Back to home</a>
